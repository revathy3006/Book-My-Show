apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
data:
  kubernetes-dashboard.json: |
    {
      "title": "Kubernetes Overview",
      "uid": "kubernetes-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "BMS Pods",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "count(kube_pod_info{namespace=\"default\", pod=~\"bms-app-.*\"})",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "BMS Available Replicas",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"default\", deployment=\"bms-app\"}",
              "refId": "A"
            }
          ]
        }
      ]
    }
